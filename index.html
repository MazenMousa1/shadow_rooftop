<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Menu Temporarily Unavailable | Shadow Rooftop</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      padding: 24px;
      background: #fff;
      color: #1b1b1b;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    main {
      width: min(100%, 560px);
    }

    h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 500;
      line-height: 1.25;
    }

    p {
      margin: 12px 0 0;
      color: #666;
      font-size: 16px;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 27px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Menu Temporarily Unavailable</h1>
    <p>Please check back later.</p>
  </main>
</body>
</html>
